# TLS-фолбэк для xray Reality self-steal: xray на :443 проксирует немаскируемых
# клиентов сюда (dest=127.0.0.1:8443) - nginx отвечает настоящим сайтом с реальным LE-сертом.
# Включать ТОЛЬКО после `certbot certonly` (файлы серта должны существовать).
# SERVER_NAME подставляется при деплое.

server {
    listen 127.0.0.1:8443 ssl;
    server_name SERVER_NAME;

    ssl_certificate     /etc/letsencrypt/live/SERVER_NAME/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/SERVER_NAME/privkey.pem;

    root /var/www/site;
    index index.html;

    # CDN WS route: xray VLESS-WS inbound на 127.0.0.1:9443 (ee через Yandex CDN).
    # Требуется только на нодах с активным VLESS-WS-CDN inbound; на остальных
    # путь /api/ws вернёт 502 - безвредно, но можно удалить.
    location /api/ws {
        proxy_pass http://127.0.0.1:9443;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    location / {
        try_files $uri $uri/index.html $uri.html =404;
    }

    error_page 404 /404.html;
    location = /404.html { internal; }
}
