# Decoy site для self-steal на VPN-ноде - HTTP-часть.
# :80 отдаёт ACME http-01 и сам сайт; после выпуска серта location / меняется на 301->https.
# SERVER_NAME подставляется при деплое (uk.proliv-network.xyz / de.proliv-network.xyz).

server {
    listen 80 default_server;
    server_name SERVER_NAME;

    location /.well-known/acme-challenge/ {
        root /var/www/acme;
    }

    root /var/www/site;
    index index.html;

    location / {
        try_files $uri $uri/index.html $uri.html =404;
    }

    error_page 404 /404.html;
    location = /404.html { internal; }
}
